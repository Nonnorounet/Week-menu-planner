<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Menu Week Planner</title>
<style>
/* Layout idea: a plain printed menu sheet. White page, black text, one dark green for actions, hairline rules instead of cards. System fonts, small radii. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#1B1B1B; --mut:#6A6A6A; --line:#D8D8D8;
  --pri:#2F5D3F; --priInk:#FFFFFF; --acc:#FFF1BF; --accInk:#1B1B1B;
  --veg:#2F6B33; --meat:#9A3B26; --fish:#24607F;
  --g:#2F6B33; --a:#946200; --r:#B03225; --n:#8A8A8A; --nBg:#F0F0F0;
  --head:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161616; --surface:#161616; --ink:#ECECEC; --mut:#9C9C9C; --line:#333;
  --pri:#6DB488; --priInk:#101010; --acc:#4A4120; --accInk:#F3F3F3;
  --veg:#86C98B; --meat:#E49A86; --fish:#7DB7DC; --g:#86C98B; --a:#E3B34A; --r:#EE8B7E; --n:#8A8A8A; --nBg:#242424;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#161616; --surface:#161616; --ink:#ECECEC; --mut:#9C9C9C; --line:#333;
  --pri:#6DB488; --priInk:#101010; --acc:#4A4120; --accInk:#F3F3F3;
  --veg:#86C98B; --meat:#E49A86; --fish:#7DB7DC; --g:#86C98B; --a:#E3B34A; --r:#EE8B7E; --n:#8A8A8A; --nBg:#242424;
  color-scheme:dark;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--head);margin:0;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ink);padding:calc(8px + env(safe-area-inset-top)) 0 8px}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:18px}
.cfg{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--mut)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:3px}
.step button{width:30px;height:30px;border:0;background:transparent;font-size:18px;line-height:1}
.step button:active{background:var(--nBg)}
.step span{min-width:44px;text-align:center;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;font-size:14px}
.cfg label{display:flex;flex-direction:column;gap:2px}

main{padding:14px 0}
h2{font-size:20px;margin:6px 0 10px}
.days{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);margin-bottom:12px}
.day{border:0;border-bottom:3px solid transparent;background:none;padding:8px 0 6px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mut)}
.day.on{color:var(--ink);border-bottom-color:var(--pri)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--n);display:block;border:1.5px solid transparent}
.dot.g{background:var(--g)}.dot.a{background:var(--a)}.dot.r{background:var(--r)}.dot.n,.dot.i{background:transparent;border-color:var(--n)}

.slot{border-bottom:1px solid var(--line);padding:12px 0;margin:0}
.sl-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;gap:8px}
.ml{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.dish{display:block;width:100%;text-align:left;border:0;background:none;padding:2px 0}
.dish b{font-size:17px;display:block;font-weight:600;line-height:1.3}
.meta{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.add{width:100%;border:1px dashed var(--mut);background:transparent;border-radius:3px;padding:12px;color:var(--pri);font-weight:600}
a{color:var(--pri)}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:inline-block}
.tag.veg{color:var(--veg)}.tag.meat{color:var(--meat)}.tag.fish{color:var(--fish)}.tag.mine{color:var(--mut)}
.vegrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;padding-left:10px;border-left:3px solid var(--veg);flex-wrap:wrap}
.vegrow.ok{color:var(--veg);font-size:13px}
.vl{display:flex;gap:8px;align-items:baseline;flex:1;min-width:180px;flex-wrap:wrap}
.lnk{border:0;background:none;padding:0;text-align:left;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.lnk.warn{color:var(--r)}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{border:1px solid var(--pri);background:var(--pri);color:var(--priInk);border-radius:3px;padding:10px 14px;font-weight:600}
.btn.sm{padding:6px 10px;font-size:14px}
.btn.ghost{background:transparent;color:var(--pri)}
.btn.acc{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.warn{background:transparent;color:var(--r);border-color:var(--r)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.card{border:1px solid var(--line);border-radius:3px;padding:12px;margin-bottom:12px}
.chip{display:inline-block;font-size:13px;font-weight:600}
.chip::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:currentColor}
.chip.g{color:var(--g)}.chip.a{color:var(--a)}.chip.r{color:var(--r)}.chip.n,.chip.i{color:var(--n)}
.chip.i::before,.chip.n::before{background:transparent;border:1.5px solid currentColor;width:8px;height:8px}
.sum{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}

.fil{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:10px}
.fb{flex:none;border:0;border-bottom:3px solid transparent;background:none;padding:8px 12px;font-size:14px;color:var(--mut);font-weight:600}
.fb.on{color:var(--ink);border-bottom-color:var(--pri)}
.prog{height:4px;background:var(--nBg);margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--pri)}
.aisle h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:16px 0 2px;font-weight:700}
.it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-height:46px}
.it input{width:22px;height:22px;accent-color:var(--pri);flex:none}
.it span{flex:1}.it b{font-variant-numeric:tabular-nums;font-weight:600}
.it.done span,.it.done b{text-decoration:line-through;color:var(--mut)}
.it .x{border:0;background:none;color:var(--mut);font-size:18px;padding:0 6px}
.addrow{display:flex;gap:8px;margin-top:14px}
input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--mut);border-radius:3px;padding:9px 10px;width:100%}

.clockbox{border:2px solid var(--ink);padding:18px 12px;text-align:center;margin:12px 0}
.clock{font-size:60px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.clockbox .meta{margin-top:8px}
.clockbox.run{background:var(--acc);color:var(--accInk)}
.clockbox.run .meta{color:inherit}
.logrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.logrow small{color:var(--mut);display:block}
.delta{font-size:13px;font-weight:600;white-space:nowrap}
.delta.g{color:var(--g)}.delta.r{color:var(--a)}

.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-size:12px;text-align:left;color:var(--mut);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--ink)}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line)}
.tbl td small{color:var(--mut);display:block;font-size:11px}
.tbl td.c{font-weight:600}
.tbl td.c.g{color:var(--g)}.tbl td.c.a{color:var(--a)}.tbl td.c.r{color:var(--r)}
.tbl td.c::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:currentColor}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:flex-start}
.checks li:first-child{border-top:0}
.checks .mk{flex:none;width:18px;text-align:center;font-weight:700}
.mk.g{color:var(--g)}.mk.a{color:var(--a)}.mk.r{color:var(--r)}
.note{font-size:13px;color:var(--mut)}
.exp{display:block;border-top:1px solid var(--line)}
.exp button{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0}
.exp b{display:block;font-weight:600}
.exp span{color:var(--mut);font-size:13px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--ink);display:grid;grid-template-columns:repeat(6,1fr);padding:0 0 env(safe-area-inset-bottom)}
nav.tabs button{border:0;border-top:3px solid transparent;background:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--mut);padding:14px 0 12px;position:relative;margin-top:-1px}
nav.tabs button.on{color:var(--ink);border-top-color:var(--pri)}
nav.tabs svg{display:none}
.badge{margin-left:4px;color:var(--bg);background:var(--ink);font-size:10px;padding:0 5px;min-width:16px;text-align:center;border-radius:2px}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .in{background:var(--bg);width:100%;max-width:680px;max-height:88%;display:flex;flex-direction:column;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:2px solid var(--ink)}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sh-h b{font-size:18px}
.sh-h button{border:1px solid var(--line);background:none;border-radius:3px;width:34px;height:34px;font-size:16px}
#pklist{overflow:auto;margin-top:6px;flex:1}
.pk{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 0}
.pk b{display:block;font-weight:600}
.pk .meta{display:flex;gap:8px;align-items:baseline;margin-top:2px;flex-wrap:wrap}
textarea{width:100%;min-height:240px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--mut);border-radius:3px;padding:10px}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chk{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-weight:500}.chk input{width:22px;height:22px;accent-color:var(--pri)}
#edscroll{overflow:auto;flex:1;padding-bottom:8px}
#f_ing{min-height:150px;font-family:var(--body);font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:3px;font-size:14px;z-index:30;opacity:0;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>

const AISLE_OF={};RAW.forEach(a=>a[15].forEach(i=>AISLE_OF[i[0].toLowerCase()]=AIS[i[3]]));
function guessAisle(n){
  const l=n.toLowerCase();if(AISLE_OF[l])return AISLE_OF[l];
  if(/tinned|canned|dried|flour|rice|pasta|spaghetti|oil|sugar|salt|stock|sauce|spice|noodle|lentil|oats|cereal|honey|vinegar|paste|nuts|almond|couscous|cracker/.test(l))return'Pantry';
  if(/chicken|beef|pork|lamb|fish|salmon|cod|tuna|ham|mince|prawn|bacon|sausage|turkey|steak/.test(l))return'Meat & fish';
  if(/milk|cheese|yogh?urt|butter|egg|cream|feta|tofu|mozzarella|hummus/.test(l))return'Dairy & eggs';
  if(/bread|roll|baguette|bun|wrap|tortilla|pitta|bagel/.test(l))return'Bakery';
  if(/apple|banana|onion|garlic|pepper|carrot|potato|tomato|lettuce|spinach|lemon|lime|herb|basil|parsley|mushroom|courgette|cucumber|salad|fruit|bean|broccoli|pea|berry|berries|grape|leek|cabbage|aubergine|avocado|ginger|chilli/.test(l))return'Produce';
  return'Other';
}
function parseIng(text,serves){
  const ing=[],bad=[],sv=Math.max(1,+serves||1);
  String(text||'').split(/\n/).forEach(line=>{
    line=line.trim();if(!line)return;
    const m=line.match(/^(\d+(?:[.,]\d+)?)\s*(kg|g|ml|cl|l|pcs|x)?\s+(.+)$/i);
    if(!m){const n=line.replace(/^./,c=>c.toUpperCase());ing.push({n:n,q:1/sv,u:'pcs',a:guessAisle(n)});return;}
    let q=parseFloat(m[1].replace(',','.')),u=(m[2]||'pcs').toLowerCase();
    if(u==='kg'){q*=1000;u='g';}else if(u==='l'){q*=1000;u='ml';}else if(u==='cl'){q*=10;u='ml';}else if(u==='x')u='pcs';
    const n=m[3].trim().replace(/^./,c=>c.toUpperCase());
    ing.push({n:n,q:q/sv,u:u,a:guessAisle(n)});
  });
  return{ing:ing,bad:bad};
}

}

/* ---------- Nutrition ---------- */
function nutri(d,diet){
  const t={kcal:0,p:0,c:0,f:0,fb:0,vg:0,fr:0,n:0,miss:0,warn:[]};
  ['b','l','d'].forEach(k=>{const s=S.plan[slotKey(d,k)];if(!s||!s.r)t.miss++;});
  MEALS.forEach(m=>{
    const s=S.plan[slotKey(d,m.k)];if(!s||!s.r)return;
    let r=R[s.r];
    if(diet==='veg'&&!r.veg){const v=vegId(s);if(v)r=R[v];else t.warn.push(R[s.r].name);}
    t.n++;t.kcal+=r.kcal;t.p+=r.p;t.c+=r.c;t.f+=r.f;t.fb+=r.fb;t.vg+=r.vg;t.fr+=r.fr;
  });
  return t;
}
function rs(v,gl,gh,al,ah){return(v>=gl&&v<=gh)?'g':(v>=al&&v<=ah)?'a':'r';}
const METRICS=[
 {l:'Energy',u:'kcal',t:'1,800 to 2,800',f:t=>t.kcal,st:v=>rs(v,1800,2800,1500,3200),fmt:v=>(Math.round(v/10)*10).toLocaleString('en')},
 {l:'Protein',u:'g',t:'55 or more',f:t=>t.p,st:v=>rs(v,55,1e9,40,1e9),fmt:v=>Math.round(v)+' g'},
 {l:'Fibre',u:'g',t:'25 or more',f:t=>t.fb,st:v=>rs(v,25,1e9,18,1e9),fmt:v=>Math.round(v)+' g'},
 {l:'Fat share',u:'%',t:'20 to 35 %',f:t=>t.kcal?t.f*9/t.kcal*100:0,st:v=>rs(v,20,35,15,40),fmt:v=>Math.round(v)+' %'},
 {l:'Carb share',u:'%',t:'45 to 60 %',f:t=>t.kcal?t.c*4/t.kcal*100:0,st:v=>rs(v,45,60,40,65),fmt:v=>Math.round(v)+' %'},
 {l:'Veg + fruit',u:'',t:'5 or more',f:t=>t.vg+t.fr,st:v=>rs(v,5,1e9,3,1e9),fmt:v=>(Math.round(v*10)/10)+' portions'}
];
function evalDay(t){
  if(!t.n)return{st:'n',label:'Empty',rows:[]};
  const rows=METRICS.map(m=>{const v=m.f(t);return{l:m.l,t:m.t,v:v,st:m.st(v),txt:m.fmt(v)};});
  const reds=rows.filter(r=>r.st==='r').length,ambers=rows.filter(r=>r.st==='a').length;
  let st=reds?'r':ambers>=2?'a':'g';
  if(t.miss)st='i';
  return{st:st,label:CHIP[st],rows:rows};
}
const CHIP={g:'Balanced',a:'Nearly there',r:'Needs work',i:'Incomplete',n:'Empty'};
function dayStatus(d){return evalDay(nutri(d,'all')).st;}
function weekChecks(){
  const out=[];let all=[];for(let d=0;d<5;d++)slotsOf(d).forEach(x=>all.push({d:d,m:x.m,s:x.s,r:R[x.s.r]}));
  const cnt=t=>all.filter(x=>x.r.type===t).length;
  const mains=['b','l','d'];let planned=0;for(let d=0;d<5;d++)mains.forEach(k=>{if(S.plan[slotKey(d,k)]&&S.plan[slotKey(d,k)].r)planned++;});
  out.push({st:planned===15?'g':planned>=10?'a':'r',t:'Main meals planned',d:planned+' of 15 breakfasts, lunches and dinners'});
  const fish=cnt('fish');out.push({st:fish>=1?'g':'r',t:'Fish at least once',d:fish?fish+' fish meal'+(fish>1?'s':'')+' this week':'No fish yet. Aim for one or two meals.'});
  const red=cnt('red');out.push({st:red<=3?'g':red<=4?'a':'r',t:'Red or processed meat, 3 meals or fewer',d:red+' meal'+(red===1?'':'s')+' this week'});
  const leg=cnt('legume');out.push({st:leg>=3?'g':leg>=1?'a':'r',t:'Pulses or tofu, 3 meals or more',d:leg+' meal'+(leg===1?'':'s')+' this week'});
  const use={};all.forEach(x=>use[x.r.id]=(use[x.r.id]||0)+1);const rep=Object.keys(use).filter(k=>use[k]>2);
  out.push({st:rep.length?'a':'g',t:'Variety, no dish more than twice',d:rep.length?rep.map(k=>R[k].name+' x'+use[k]).join(', '):'Every dish appears twice or less'});
  const full=[0,1,2,3,4].filter(d=>nutri(d,'all').n>0);const avg=full.length?full.reduce((a,d)=>{const t=nutri(d,'all');return a+t.vg+t.fr;},0)/full.length:0;
  out.push({st:avg>=5?'g':avg>=3?'a':'r',t:'Veg and fruit, 5 portions a day',d:'Average '+(Math.round(avg*10)/10)+' portions per planned day'});
  if(S.vegPeople>0){const gaps=all.filter(x=>!x.r.veg&&!vegId(x.s));out.push({st:gaps.length?'r':'g',t:'Vegetarian dish for every meat meal',d:gaps.length?gaps.length+' meal'+(gaps.length>1?'s':'')+' without one: '+gaps.slice(0,3).map(x=>DAYS[x.d].slice(0,3)+' '+x.m.n.toLowerCase()).join(', '):'All covered for '+S.vegPeople+' vegetarian'+(S.vegPeople>1?'s':'')});}
  return out;
}

function shopData(dayFilter){

    MEALS.forEach(mm=>{const s=S.plan[slotKey(d,mm.k)];portions(s).forEach(p=>R[p.rid].ing.forEach(i=>{const k=i.a+'|'+i.n+'|'+i.u;m[k]=(m[k]||0)+i.q*p.n;}));});}
  const items=Object.keys(m).map(k=>{const a=k.split('|');return{k:k,aisle:a[0],name:a[1],unit:a[2],q:m[k]};});
  items.sort((x,y)=>AORDER.indexOf(x.aisle)-AORDER.indexOf(y.aisle)||x.name.localeCompare(y.name));
  return items;
}

function slotCard(d,m){
  const key=slotKey(d,m.k),s=S.plan[key],lab=m.n;
  if(!s||!s.r)return`<section class="slot"><div class="sl-h"><span class="ml">${lab}</span></div><button class="add" data-a="pick" data-key="${key}" data-mode="main">+ Choose ${lab.toLowerCase()}</button></section>`;
  const r=R[s.r];
  let h=`<section class="slot"><div class="sl-h"><span class="ml">${lab}</span>${tagHtml(r)}</div>
  <button class="dish" data-a="pick" data-key="${key}" data-mode="main"><b>${esc(r.name)}</b><span class="meta">${r.prep} min prep · ${r.cook} min cook · ${r.kcal} kcal</span></button>`;
  if(!r.veg){
    const v=vegId(s),n=vegCount(s);
    h+=`<div class="vegrow"><div class="vl"><span class="tag veg">Vegetarian</span>${v?`<button class="lnk" data-a="pick" data-key="${key}" data-mode="veg">${esc(R[v].name)}</button>`:`<button class="lnk warn" data-a="pick" data-key="${key}" data-mode="veg">Choose a vegetarian dish</button>`}</div>
    <span class="step"><button data-a="sv" data-key="${key}" data-d="-1" aria-label="Fewer vegetarian portions">−</button><span>${n} of ${S.people}</span><button data-a="sv" data-key="${key}" data-d="1" aria-label="More vegetarian portions">+</button></span></div>`;
  }else h+=`<div class="vegrow ok">Suits everyone. Cooked for ${S.people}.</div>`;
  h+=`<div class="acts"><button class="btn sm" data-a="timeslot" data-key="${key}">Time it</button><button class="btn sm ghost" data-a="clearslot" data-key="${key}">Remove</button></div></section>`;
  return h;
}
function viewPlan(){
  const d=S.day;
  let h=`<div class="days">`+DAYS.map((n,i)=>`<button class="day ${i===d?'on':''}" data-a="day" data-i="${i}">${n.slice(0,3)}<i class="dot ${dayStatus(i)}"></i></button>`).join('')+`</div>`;
  h+=`<h2>${DAYS[d]}</h2>`;
  MEALS.forEach(m=>h+=slotCard(d,m));
  const e1=evalDay(nutri(d,'all')),e2=evalDay(nutri(d,'veg'));
  h+=`<div class="card"><div class="sum"><span>Everyone</span><span class="chip ${e1.st}">${e1.label}</span><span>Vegetarians</span><span class="chip ${e2.st}">${e2.label}</span></div>${e1.st==='i'?'<p class="note" style="margin:8px 0 0">Add breakfast, lunch and dinner to judge the day.</p>':''}</div>`;
  h+=`<div class="row"><button class="btn ghost" data-a="autofill">Fill empty slots this week</button><button class="btn warn" data-a="clearday">Clear ${DAYS[d]}</button></div>`;
  return h;
}
function viewShop(){
  const items=shopData(S.shopDay);
  const done=items.filter(i=>S.ticks[i.k]).length+S.custom.filter(c=>c.done).length,total=items.length+S.custom.length;
  let h=`<h2>Shopping list</h2><div class="fil"><button class="fb ${S.shopDay==='all'?'on':''}" data-a="sd" data-v="all">Whole week</button>`+DAYS.map((n,i)=>`<button class="fb ${S.shopDay==String(i)?'on':''}" data-a="sd" data-v="${i}">${n.slice(0,3)}</button>`).join('')+`</div>`;
  h+=`<div class="sum"><span>${done} of ${total} ticked · for ${S.people} people${S.vegPeople?`, ${S.vegPeople} vegetarian`:''}</span></div><div class="prog"><i style="width:${total?done/total*100:0}%"></i></div>`;
  if(!items.length&&!S.custom.length)h+=`<p class="note">Nothing planned for this selection yet.</p>`;
  const groups={};items.forEach(i=>(groups[i.aisle]=groups[i.aisle]||[]).push(i));
  AORDER.forEach(a=>{
    const list=(groups[a]||[]).filter(i=>!(S.hideDone&&S.ticks[i.k]));if(!list.length)return;
    h+=`<div class="aisle"><h3>${a}</h3>`+list.map(i=>`<label class="it ${S.ticks[i.k]?'done':''}"><input type="checkbox" data-a="tick" data-k="${esc(i.k)}" ${S.ticks[i.k]?'checked':''}><span>${esc(i.name)}</span><b>${fmtQty(i.q,i.unit)}</b></label>`).join('')+`</div>`;
  });
  const cu=S.custom.filter(c=>!(S.hideDone&&c.done));
  if(cu.length)h+=`<div class="aisle"><h3>Added by you</h3>`+cu.map(c=>`<label class="it ${c.done?'done':''}"><input type="checkbox" data-a="ctick" data-id="${c.id}" ${c.done?'checked':''}><span>${esc(c.name)}</span><button class="x" data-a="cdel" data-id="${c.id}" aria-label="Delete ${esc(c.name)}">×</button></label>`).join('')+`</div>`;
  h+=`<div class="addrow"><input type="text" id="newitem" placeholder="Add an item (e.g. washing-up liquid)" maxlength="60"><button class="btn" data-a="cadd">Add</button></div>`;
  h+=`<div class="row"><button class="btn ghost" data-a="hide">${S.hideDone?'Show ticked':'Hide ticked'}</button><button class="btn ghost" data-a="untick">Untick all</button><button class="btn ghost" data-a="copyshop">Copy list</button></div>`;
  return h;
}
function fmtClock(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60);return String(Math.floor(m/60)?Math.floor(m/60)+':'+String(m%60).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(s%60).padStart(2,'0');}
function elapsed(){return S.timer.acc+(S.timer.run?Date.now()-S.timer.start:0);}
function slotLabel(key){const a=key.split('-'),s=S.plan[key];return DAYS[+a[0]].slice(0,3)+' · '+mealName(a[1])+(s&&s.r?' — '+R[s.r].name:'');}
function viewTimer(){
  const T=S.timer,el=elapsed();
  const opts=[`<option value="">Free timer</option>`];
  for(let d=0;d<5;d++)slotsOf(d).forEach(x=>opts.push(`<option value="${x.key}" ${T.key===x.key?'selected':''}>${esc(slotLabel(x.key))}</option>`));
  const s=T.key&&S.plan[T.key]&&S.plan[T.key].r?R[S.plan[T.key].r]:null;
  let h=`<h2>Prep timer</h2><label for="tsel" class="note">What are you preparing?</label><select id="tsel" data-a="tsel">${opts.join('')}</select>
  <div class="clockbox ${T.run?'run':''}"><div class="clock" id="clock">${fmtClock(el)}</div><div class="meta">${s?`Estimate: ${s.prep} min prep, ${s.cook} min cook`:'No estimate for a free timer'}</div></div>
  <div class="row" style="justify-content:center">`;
  if(!T.run&&!el)h+=`<button class="btn acc" data-a="tstart">Start</button>`;
  else{h+=T.run?`<button class="btn acc" data-a="tpause">Pause</button>`:`<button class="btn acc" data-a="tstart">Resume</button>`;h+=`<button class="btn" data-a="tstop">Stop and log</button><button class="btn warn" data-a="treset">Discard</button>`;}
  h+=`</div><div class="card"><b>Log a time by hand</b><div class="addrow"><input type="number" id="mm" inputmode="numeric" min="1" max="600" placeholder="Minutes"><button class="btn ghost" data-a="tmanual">Add</button></div></div>`;
  const L=S.log.slice().reverse();
  if(L.length){
    const tot=L.reduce((a,x)=>a+x.secs,0),ests=L.filter(x=>x.est);const diff=ests.reduce((a,x)=>a+(x.secs-x.est),0);
    h+=`<h2 style="margin-top:20px">Logged times</h2><div class="sum" style="margin-bottom:6px"><span>${L.length} session${L.length>1?'s':''} · ${Math.round(tot/60)} min in total${ests.length?` · ${diff>=0?'+':'−'}${Math.round(Math.abs(diff)/60)} min against estimates`:''}</span></div>`;
    h+=L.map(x=>{const dl=x.est?Math.round((x.secs-x.est)/60):null;return`<div class="logrow"><div>${esc(x.label)}<small>${new Date(x.ts).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small></div><div style="display:flex;gap:8px;align-items:center"><b>${Math.max(1,Math.round(x.secs/60))} min</b>${dl!==null?`<span class="delta ${dl<=0?'g':'r'}">${dl===0?'on time':(dl>0?'+':'−')+Math.abs(dl)+' min'}</span>`:''}<button class="x lnk" data-a="ldel" data-id="${x.id}" aria-label="Delete entry">×</button></div></div>`}).join('');
  }else h+=`<p class="note">Times you log appear here, with the difference from each recipe's estimate.</p>`;
  return h;
}

function viewBalance(){
  let h=`<h2>Week balance</h2><div class="card"><ul class="checks">`+weekChecks().map(c=>`<li><span class="mk ${c.st}">${c.st==='g'?'✓':c.st==='a'?'!':'×'}</span><div><b>${c.t}</b><div class="note">${esc(c.d)}</div></div></li>`).join('')+`</ul></div>`;
  for(let d=0;d<5;d++){
    const t1=nutri(d,'all'),t2=nutri(d,'veg'),e1=evalDay(t1),e2=evalDay(t2);
    h+=`<div class="card"><div class="sl-h"><h3 style="font-size:18px">${DAYS[d]}</h3><span class="chip ${e1.st}">${e1.label}</span></div>`;
    if(!t1.n){h+=`<p class="note">No meals planned.</p></div>`;continue;}
    h+=`<table class="tbl"><thead><tr><th>Per person</th><th>Everyone</th><th>Vegetarian</th></tr></thead><tbody>`+METRICS.map((m,i)=>`<tr><td>${m.l}<small>${m.t}</small></td><td class="c ${e1.rows[i].st}">${e1.rows[i].txt}</td><td class="c ${e2.rows[i].st}">${e2.rows[i].txt}</td></tr>`).join('')+`</tbody></table>`;
    if(t2.warn.length)h+=`<p class="note" style="margin:8px 0 0">Vegetarian column assumes the main dish for: ${t2.warn.map(esc).join(', ')}. Choose a vegetarian dish on the Plan tab.</p>`;
    h+=`</div>`;
  }
  h+=`<p class="note">Targets suit a healthy adult and are a guide only. Values are estimates per portion, so use them to compare days rather than to count calories exactly. Anyone with an allergy or medical diet should check the dishes themselves.</p>`;
  return h;
}

function saveRecipe(){
  const g=i=>$('#'+i).value,n=i=>Math.max(0,parseFloat(String(g(i)).replace(',','.'))||0);
  const name=g('f_name').trim();if(!name){toast('Give the recipe a name');return false;}
  const serves=Math.max(1,Math.round(n('f_serves'))||1);
  const p=parseIng(g('f_ing'),serves);
  if(!p.ing.length){toast('Add at least one ingredient, starting with a quantity');return false;}
  if(p.bad.length){toast('Add a quantity to: '+p.bad[0]);return false;}
  const veg=$('#f_veg').checked;let type=g('f_type');if(veg&&['red','poultry','fish'].includes(type))type='veg';
  const o={id:ED.id||'u'+Date.now(),name:name,meal:g('f_meal'),veg:veg,alt:veg?'':g('f_alt'),serves:serves,prep:n('f_prep'),cook:n('f_cook'),
    kcal:n('f_kcal'),p:n('f_p'),c:n('f_c'),f:n('f_f'),fb:n('f_fb'),vg:n('f_vg'),fr:n('f_fr'),type:type,ingText:g('f_ing'),src:ED.src||''};
  const i=S.myRecipes.findIndex(x=>x.id===o.id);if(i>=0)S.myRecipes[i]=o;else S.myRecipes.push(o);
  syncCustom();
  const c=ED.ctx;
  if(c&&c.key){const s=S.plan[c.key]||{};if(c.mode==='veg'){s.vr=o.id;S.plan[c.key]=s;}else S.plan[c.key]={r:o.id,vegN:s.vegN};}
  toast('Saved '+name);return true;
}

async function saveFile(name,data){
  if(window.AndroidBridge&&window.AndroidBridge.save){
    try{
      const blob=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'});
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(blob);});
      const ok=window.AndroidBridge.save(name,b64);
      toast(ok?('Saved to Downloads: '+name):'Could not save '+name);return;
    }catch(e){toast('Could not save '+name);return;}
  }
  try{
    if(window.claude&&window.claude.use){const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:name,data:data});toast('Saved '+name);return;}}
  }catch(e){if(e&&e.code==='declined')return;}
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'});
    const file=new File([blob],name,{type:blob.type});
    if(/Android|iPhone|iPad/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return;}catch(e){if(e&&e.name==='AbortError')return;}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);toast('Saved '+name);
  }catch(e){toast('This device blocked the download. Use Copy instead.');}
}

/* ---------- Actions ---------- */
function autofill(){
  const used={};Object.values(S.plan).forEach(s=>{if(s&&s.r)used[s.r]=(used[s.r]||0)+1;});
  const cnt=t=>Object.values(S.plan).filter(s=>s&&s.r&&R[s.r].type===t).length;
  let filled=0;
  for(let d=0;d<5;d++)MEALS.forEach(m=>{
    const key=slotKey(d,m.k);if(S.plan[key]&&S.plan[key].r)return;
    const reds=cnt('red'),fish=cnt('fish');
    const score=r=>(used[r.id]||0)+Math.random()*0.8-(r.type==='fish'&&!fish?0.9:0)+(r.type==='red'&&reds>=3?5:0);
    const c=Object.values(R).filter(r=>r.meal===m.k).sort((a,b)=>score(a)-score(b))[0];
    S.plan[key]={r:c.id};used[c.id]=(used[c.id]||0)+1;filled++;
  });
  toast(filled?filled+' slot'+(filled>1?'s':'')+' filled':'Nothing to fill');
}

      S.timer.run=false;S.timer.acc=0;toast('Logged '+Math.max(1,Math.round(secs/60))+' min');break;}
    case'treset':S.timer.run=false;S.timer.acc=0;break;
    case'tmanual':{const m=parseFloat($('#mm').value);if(!(m>0))return;const k=S.timer.key,s=k&&S.plan[k]&&S.plan[k].r?R[S.plan[k].r]:null;
      S.log.push({id:'l'+Date.now(),ts:Date.now(),label:k?slotLabel(k):'Manual entry',secs:Math.round(m*60),est:s?s.prep*60:0});toast('Logged');break;}
    case'ldel':S.log=S.log.filter(x=>x.id!==D.id);break;
    case'xlsx':saveFile('menu-week.xlsx',buildXlsx());return;
    case'pdf':saveFile('menu-week.pdf',buildPdf());return;
    case'csv':saveFile('shopping-list.csv',buildCsv());return;
    case'clearweek':if(!confirmTwice(el))return;S.plan={};S.ticks={};S.custom=[];toast('Week cleared');break;
    case'sample':S.plan={};Object.keys(SAMPLE).forEach(k=>S.plan[k]={r:SAMPLE[k]});S.ticks={};break;
  }
  render();
}
let armed=null;
function confirmTwice(el){const id=el.dataset.a+(el.dataset.id||'');if(armed===id){armed=null;return true;}armed=id;const orig=el.textContent;el.textContent='Tap again to confirm';setTimeout(()=>{armed=null;if(el.isConnected)el.textContent=orig;},3000);return false;}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName==='SELECT')return;act(el.dataset.a,el);});
document.addEventListener('change',e=>{
  if(e.target.id==='tsel'){S.timer.key=e.target.value;render();}
  if(ED&&(e.target.id==='f_meal'||e.target.id==='f_veg')){$('#f_altw').hidden=$('#f_veg').checked;$('#f_alt').innerHTML=altOptions($('#f_meal').value,'',ED.id);}
});
document.addEventListener('input',e=>{if(e.target.id==='pq'&&PK){PK.q=e.target.value;renderPk();}if(e.target.id==='bbcq'){S.bbcQ=e.target.value;renderBbc();save();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newitem')act('cadd',e.target);if(e.key==='Escape'&&!$('#sheet').hidden)act('closeSheet',e.target);});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')act('closeSheet',e.target);});
setInterval(()=>{const c=$('#clock');if(c&&S.timer.run)c.textContent=fmtClock(elapsed());},500);
render();
</script>
</body>
